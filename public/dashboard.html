<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Count Dashboard</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
    background:#f2f4f8;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    background:#1565c0;
    color:#fff;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.container{
    max-width:1100px;
    margin:20px auto;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.card{
    background:#fff;
    border-radius:10px;
    padding:15px;
}

label{
    display:block;
    margin-top:10px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    box-sizing:border-box;
}

button{
    margin-top:15px;
    padding:12px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:30px;
    background:white;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
}

th{
    background:#1565c0;
    color:white;
}

.actions button{
    margin:2px;
}

.totalBox{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}

</style>

</head>

<body>

<header>

<h2>Count App</h2>

<button id="logoutBtn">
Sign Out
</button>

</header>

<div class="container">

<div class="card">

<h3>New Count</h3>

<div class="grid">

<div>
<label>Date</label>
<input type="date" id="date">
</div>

<div>
<label>Name</label>
<input id="name">
</div>

<div>
<label>Cash</label>
<input type="number" id="cash">
</div>

<div>
<label>System</label>
<input type="number" id="system">
</div>

<div>
<label>Out 1</label>
<input type="number" id="out1">
</div>

<div>
<label>Out 2</label>
<input type="number" id="out2">
</div>

<div>
<label>Out 3</label>
<input type="number" id="out3">
</div>

<div>
<label>Out 4</label>
<input type="number" id="out4">
</div>

<div>
<label>Out 5</label>
<input type="number" id="out5">
</div>

<div>
<label>Till</label>
<input type="number" id="till">
</div>

<div>
<label>Reason</label>
<input id="reason">
</div>

<div>
<label>Count</label>
<input id="count">
</div>

<div>
<label>Confirm Till</label>
<input type="number" id="confirmTill">
</div>

</div>

<div class="totalBox">

Difference:

<span id="difference">

0.00

</span>

</div>

<button id="saveBtn">

Save Record

</button>

</div>

<table>

<thead>

<tr>

<th>Date</th>
<th>Name</th>
<th>Cash</th>
<th>System</th>
<th>Till</th>
<th>Difference</th>
<th>Actions</th>

</tr>

</thead>

<tbody id="records">

</tbody>

</table>

</div>

<script type="module" src="js/dashboard.js"></script>

</body>

</html>
